<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskLens — Visual Search</title>
    <link rel="stylesheet" href="results.css" />
  </head>
  <body>
    <div class="results-layout">
      <!-- Top Header -->
      <header class="results-header">
        <div class="brand">
          <span class="icon">🔎</span>
          <div>
            <strong>DeskLens</strong>
            <span class="tag">Visual Search</span>
          </div>
        </div>
        <button id="close-results-btn" class="icon-btn" title="Close Panel">✕</button>
      </header>

      <!-- Cropped Image Preview Section -->
      <section class="crop-section">
        <div class="crop-card">
          <div class="thumb-wrapper" id="thumb-wrapper">
            <img id="results-thumb" alt="Cropped search query" />
            <div id="ocr-highlight-overlay" class="ocr-overlay"></div>
          </div>
        </div>
        <div class="crop-meta">
          <span id="crop-resolution" class="meta-badge">0 × 0 px</span>
          <span id="crop-status" class="meta-badge active">Crop Ready</span>
        </div>
      </section>

      <!-- Quick Action Toolbar -->
      <section class="quick-actions">
        <button id="copy-img-btn" type="button" class="action-btn">
          <span>📋</span> Copy Image
        </button>
        <button id="save-img-btn" type="button" class="action-btn">
          <span>💾</span> Save PNG
        </button>
      </section>

      <!-- Extracted OCR Text Section (Sprint 4) -->
      <section class="ocr-section">
        <div class="ocr-header">
          <div class="ocr-title">
            <span>📝</span>
            <strong>Recognized Text</strong>
            <span id="ocr-word-count" class="meta-badge">0 words</span>
          </div>
          <button id="copy-ocr-btn" type="button" class="mini-btn" title="Copy Text">
            📋 Copy
          </button>
        </div>
        <textarea id="ocr-text-box" placeholder="Detecting text in crop..." readonly></textarea>
      </section>

      <!-- Embedded Search Engine Options -->
      <section class="search-engines">
        <h3>Visual Search</h3>
        <div class="provider-list">
          <button id="provider-google-lens" type="button" class="provider-card active">
            <div class="provider-info">
              <span class="provider-icon">🔍</span>
              <div>
                <strong>Google Lens</strong>
                <p>Auto-uploads crop &amp; opens visual matches</p>
              </div>
            </div>
            <span class="arrow">→</span>
          </button>

          <button id="provider-google-images" type="button" class="provider-card">
            <div class="provider-info">
              <span class="provider-icon">🖼️</span>
              <div>
                <strong>Google Images</strong>
                <p>Copies crop &amp; opens reverse image search</p>
              </div>
            </div>
            <span class="arrow">→</span>
          </button>
        </div>
      </section>

      <!-- In-App Notification / Toast -->
      <div id="toast" class="toast hidden">Copied to clipboard!</div>
    </div>

    <script type="module" src="results.js"></script>
  </body>
</html>
