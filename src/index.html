<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskLens</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Fullscreen Frozen Overlay View (Sprints 1 & 2) -->
    <div id="overlay-view" class="overlay-container hidden">
      <!-- Background Frozen Desktop Screenshot Container (Requirement R3) -->
      <div id="capture-container" class="capture-container">
        <img id="frozen-image" alt="Frozen Desktop Frame" />
      </div>
      
      <!-- Ambient Outer Lens Glow Frame -->
      <div class="lens-frame"></div>

      <!-- Top Interactive Control Bar -->
      <header class="lens-header">
        <div class="lens-badge">
          <span class="lens-icon">🔎</span>
          <strong>DeskLens</strong>
          <span class="badge-tag">Drag to Select</span>
        </div>
        <div class="lens-hint">
          Drag to crop • Press <kbd>ESC</kbd> to exit
        </div>
        <button id="close-overlay-btn" class="close-btn" title="Exit Overlay (ESC)">✕</button>
      </header>

      <!-- Interactive Selection & Cropping Layer (Sprint 2) -->
      <div id="selection-layer" class="selection-layer">
        <!-- Dimmed Outer Mask (SVG cut-out) -->
        <svg id="mask-svg" class="mask-svg">
          <defs>
            <mask id="cutout-mask">
              <!-- White background reveals dimming -->
              <rect width="100%" height="100%" fill="white" />
              <!-- Black cutout reveals original clear screen -->
              <rect id="mask-cutout" x="0" y="0" width="0" height="0" fill="black" />
            </mask>
          </defs>
          <rect width="100%" height="100%" fill="rgba(0, 0, 0, 0.55)" mask="url(#cutout-mask)" />
        </svg>

        <!-- Interactive Crop Box -->
        <div id="crop-box" class="crop-box hidden">
          <!-- Interactive Word Highlights (Google Lens Style) -->
          <div id="crop-text-highlights" class="crop-text-highlights"></div>

          <!-- 4 Corner Google Lens Brackets -->
          <div class="corner-bracket tl"></div>
          <div class="corner-bracket tr"></div>
          <div class="corner-bracket bl"></div>
          <div class="corner-bracket br"></div>

          <!-- 4 Edge Drag Handles -->
          <div class="edge-handle top" data-handle="top"></div>
          <div class="edge-handle bottom" data-handle="bottom"></div>
          <div class="edge-handle left" data-handle="left"></div>
          <div class="edge-handle right" data-handle="right"></div>

          <!-- Live Dimension Tooltip -->
          <div id="crop-dimensions" class="crop-dimensions">0 × 0 px</div>

          <!-- Floating Action Bar (Anchored near selection) -->
          <div id="crop-actions" class="crop-actions hidden">
            <div class="preview-chip">
              <img id="crop-preview-thumb" alt="Crop preview" />
            </div>
            <button id="search-action-btn" class="action-btn primary" title="Search with Google Lens">
              <span>🔍</span> Search Image
            </button>
            <div id="lang-selector-group" class="lang-selector-group" title="Language Translation Pair">
              <select id="source-lang-select" class="lang-select" title="Source Language">
                <option value="auto">Auto Detect</option>
                <option value="en">English</option>
                <option value="pt">Portuguese</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="it">Italian</option>
                <option value="ru">Russian</option>
                <option value="ko">Korean</option>
              </select>
              <span class="lang-arrow">→</span>
              <select id="target-lang-select" class="lang-select" title="Target Language">
                <option value="pt" selected>Portuguese</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="it">Italian</option>
                <option value="ru">Russian</option>
                <option value="ko">Korean</option>
              </select>
            </div>
            <button id="translate-action-btn" class="action-btn secondary" title="Translate on screen (Portuguese)">
              <span>🌐</span> Translate
            </button>
            <button id="ocr-action-btn" class="action-btn secondary" title="Extract text via OCR">
              <span>📝</span> Copy Text
            </button>
            <button id="clear-action-btn" class="action-btn ghost" title="Clear selection">
              <span>🔄</span> Clear
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings / Preferences View -->
    <div id="settings-view" class="settings-container">
      <main class="container">
        <h1>🔎 DeskLens — Settings</h1>
        <p class="subtitle">
          Background engine active in system tray.
        </p>
        <div class="status-card">
          <p><strong>Status:</strong> Running silently in background</p>
          <p><strong>Global Shortcut:</strong> <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd></p>
        </div>
        <div class="actions-row">
          <button id="test-capture-btn" class="secondary-btn" type="button">Test Screen Capture</button>
          <button id="hide-btn" class="primary-btn" type="button">Hide to System Tray</button>
        </div>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
