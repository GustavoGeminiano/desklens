<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskLens</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>🔎 DeskLens — Settings</h1>
      <p class="subtitle">
        Background engine active in system tray.
      </p>
      <div class="status-card">
        <p><strong>Status:</strong> Running silently in background</p>
        <p><strong>Global Shortcut:</strong> <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd></p>
      </div>
      <button id="hide-btn" type="button">Hide to System Tray</button>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
