name: OCR V2 experimental installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ocr_worker/**'
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'scripts/ocr_benchmark/test*.py'
      - 'src-tauri/tauri.ocr.conf.json'
      - '.github/workflows/ocr-v2.yml'
concurrency:
  group: ocr-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OMP_THREAD_LIMIT: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-por xvfb
      - run: npm ci
      - run: python -m pip install -r tools/ocr_worker/requirements-build.txt
      - run: python scripts/ocr_benchmark/rapidocr_engine.py prepare --model-dir .ocr-models
      - run: npm test
      - run: python -m unittest discover -s tools/ocr_worker -p "test_*.py"
      - run: python -m unittest discover -s scripts/ocr_benchmark -p "test_*.py"
      - run: cargo test --locked -p desklens --features ocr-v2 ocr_service::tests --lib
      - run: cargo build --locked --manifest-path tools/ocr-diagnostic/Cargo.toml
      - name: Development evaluation
        shell: bash
        run: python tools/ocr_worker/evaluate_layout.py --diagnostic tools/ocr-diagnostic/target/debug/ocr_diagnostic${{ runner.os == 'Windows' && '.exe' || '' }} --output benchmark-results-v2/development
      - name: Held-out evaluation (no tuning)
        shell: bash
        run: python tools/ocr_worker/evaluate_layout.py --split heldout --diagnostic tools/ocr-diagnostic/target/debug/ocr_diagnostic${{ runner.os == 'Windows' && '.exe' || '' }} --output benchmark-results-v2/heldout
      - run: python tools/ocr_worker/build.py
      - run: npm run ocr:build -- --bundles ${{ matrix.bundle }}
      - name: Extract Linux installer and test offline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/installed
          dpkg-deb -x target/release/bundle/deb/*.deb build/installed
          runtime=$(find build/installed/usr/lib -type d -name ocr-runtime -print -quit)
          test -n "$runtime"
          sudo -E xvfb-run -a unshare --net "$(which python)" tools/ocr_worker/smoke_packaged.py --runtime "$runtime" --app build/installed/usr/bin/desklens --output benchmark-results-v2/installed-smoke
      - name: Install Windows bundle and test offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'DeskLens-OCR-Test'
          Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait
          $app = (Get-ChildItem $destination -Filter desklens.exe -Recurse | Select-Object -First 1).FullName
          $worker = (Get-ChildItem $destination -Filter desklens-ocr.exe -Recurse | Select-Object -First 1).FullName
          if (!$app -or !$worker) { throw 'Installer did not contain application and OCR runtime' }
          New-NetFirewallRule -DisplayName DeskLens-OCR-Test -Direction Outbound -Program $worker -Action Block
          New-NetFirewallRule -DisplayName DeskLens-App-Test -Direction Outbound -Program $app -Action Block
          python tools/ocr_worker/smoke_packaged.py --runtime (Split-Path $worker) --app $app --output benchmark-results-v2/installed-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload reports and experimental installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desklens-ocr-v2-${{ runner.os }}
          path: |
            benchmark-results-v2/
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
