[package]
name = "desklens-ocr-diagnostic"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent from the Tauri workspace and desktop dependencies.
[workspace]

[[bin]]
name = "ocr_diagnostic"
path = "../../src-tauri/examples/ocr_diagnostic.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation",
    "Foundation_Collections", "Globalization",
] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
